const AUDIO_BASE='audios/game-3/';
const $=id=>document.getElementById(id);
const paths={sound:'<path d="M11 5 6 9H3v6h3l5 4V5zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',mute:'<path d="M11 5 6 9H3v6h3l5 4V5zM16 9l5 6m0-6-5 6"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 5 11 7-11 7z"/>',left:'<path d="m14 5-7 7 7 7"/>',right:'<path d="m10 5 7 7-7 7"/>',hand:'<path d="M9 12V5a2 2 0 0 1 4 0v6l3-1 4 3-2 8h-7l-6-7a2 2 0 0 1 3-2l1 1"/>',face:'<circle cx="12" cy="12" r="9"/><path d="M8 9h.01M16 9h.01M8 14q4 5 8 0"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>'}
let group='pedidos',pages={pedidos:0,sentimentos:0},selected=null,soundEnabled=true;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');let calm=reduceMotion.matches;
const audio=new Audio();audio.preload='auto';const synth=window.speechSynthesis;let sequence=0,cleanup=null,activeUtterance=null;
function stopVoice(){sequence++;if(cleanup){cleanup();cleanup=null}audio.pause();if(synth)synth.cancel();activeUtterance=null;$('sentence').classList.remove('speaking')}
function fallback(clip,ticket){
 if(ticket!==sequence)return;
 if(!synth||!window.SpeechSynthesisUtterance){console.warn('Voz indisponível:',clip.file);$('repeat').setAttribute('aria-label','Tentar ouvir novamente');return}
 const u=new SpeechSynthesisUtterance(clip.text);activeUtterance=u;u.lang='pt-BR';u.rate=.85;u.pitch=1;u.volume=1;
 const voices=synth.getVoices();const voice=voices.find(v=>v.lang.replace('_','-').toLowerCase()==='pt-br')||voices.find(v=>v.lang.toLowerCase().startsWith('pt'));if(voice)u.voice=voice;
 const finish=()=>{if(ticket===sequence){$('sentence').classList.remove('speaking');activeUtterance=null}};u.onend=finish;u.onerror=finish;
 try{if(synth.paused)synth.resume();$('sentence').classList.add('speaking');synth.speak(u)}catch(e){finish()}
}
function say(clip,force=false){
 stopVoice();if(!soundEnabled&&!force)return;
 const ticket=sequence;let settled=false,timer;
 const release=()=>{clearTimeout(timer);audio.onplaying=null;audio.onended=null;audio.onerror=null};cleanup=release;
 const failed=reason=>{if(settled||ticket!==sequence)return;settled=true;release();audio.pause();console.warn('MP3 indisponível:',new URL(AUDIO_BASE+clip.file,document.baseURI).href,reason);fallback(clip,ticket)};
 audio.onplaying=()=>{if(ticket===sequence){clearTimeout(timer);$('sentence').classList.add('speaking')}};
 audio.onended=()=>{if(ticket!==sequence)return;settled=true;release();$('sentence').classList.remove('speaking')};
 audio.onerror=()=>failed(audio.error?.message||'Arquivo ausente ou formato incompatível');
 timer=setTimeout(()=>failed('Tempo de carregamento excedido'),10000);
 audio.src=new URL(AUDIO_BASE+clip.file,document.baseURI).href;
 try{audio.play()?.catch(e=>failed(e.name+': '+e.message))}catch(e){failed(e.message)}
}
function selectCard(card,button){
 selected=card;$('phrase').textContent=card.text;$('chosen-image').src=ART[card.image];$('chosen-image').alt=card.label;
 document.querySelectorAll('[data-card]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.card===card.id)));
 if(!calm&&!reduceMotion.matches){button.classList.remove('pulse');void button.offsetWidth;button.classList.add('pulse')}
 say(card);
}
function makeCard(card,fixed=false){
 const b=document.createElement('button');b.className=fixed?'':'card';b.dataset.card=card.id;b.dataset.tone=group==='sentimentos'&&!fixed?'feeling':'request';b.setAttribute('aria-label',card.text);b.setAttribute('aria-pressed',String(selected?.id===card.id));
 const img=document.createElement('img');img.src=ART[card.image];img.alt='';img.draggable=false;const text=document.createElement('span');text.textContent=card.label;b.append(img,text);b.onclick=()=>selectCard(card,b);return b;
}
function render(){
 const page=pages[group],count=Math.ceil(GROUPS[group].length/6);
 $('board').replaceChildren(...GROUPS[group].slice(page*6,page*6+6).map(c=>makeCard(c)));
 $('board').setAttribute('aria-labelledby','tab-'+group);
 for(const name of ['pedidos','sentimentos']){const tab=$('tab-'+name);tab.setAttribute('aria-selected',String(name===group));tab.tabIndex=name===group?0:-1}
 $('previous').disabled=page===0;$('next').disabled=page===count-1;
 $('page-count').textContent=`${page+1} de ${count}`;$('page-count').setAttribute('aria-label',`Página ${page+1} de ${count}`);
 $('dots').replaceChildren(...Array.from({length:count},(_,i)=>{const dot=document.createElement('span');dot.className='dot'+(i===page?' active':'');return dot}));
}

function updateTools(){
 $('sound').innerHTML=icon(soundEnabled?'sound':'mute');$('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'Desligar som':'Ligar som');
 $('motion').innerHTML=icon(calm?'play':'pause');$('motion').setAttribute('aria-pressed',String(calm));$('motion').setAttribute('aria-label',calm?'Ligar animações':'Desligar animações');document.body.classList.toggle('calm',calm);
}
$('tab-pedidos').innerHTML=icon('hand')+'Eu quero…';$('tab-sentimentos').innerHTML=icon('face')+'Estou…';
for(const name of ['pedidos','sentimentos']){
 const tab=$('tab-'+name);tab.onclick=()=>setGroup(name);
 tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'pedidos':e.key==='End'?'sentimentos':group==='pedidos'?'sentimentos':'pedidos';setGroup(next);$('tab-'+next).focus()}};
}
$('repeat').innerHTML=icon('sound');$('repeat').onclick=()=>say(selected||CONTROLS.inicio);
$('previous').innerHTML=icon('left')+'Voltar';$('previous').setAttribute('aria-label','Página anterior');$('next').innerHTML='Mais'+icon('right');$('next').setAttribute('aria-label','Mais figuras');
$('previous').onclick=()=>{if(pages[group]>0){pages[group]--;render();say(CONTROLS[group+'-prev'])}};
$('next').onclick=()=>{if(pages[group]<Math.ceil(GROUPS[group].length/6)-1){pages[group]++;render();say(CONTROLS[group+'-next'])}};
$('quick').replaceChildren(...GROUPS.fixed.map(c=>makeCard(c,true)));
$('sound').onclick=()=>{soundEnabled=!soundEnabled;updateTools();say(CONTROLS[soundEnabled?'som-on':'som-off'],true)};
$('motion').onclick=()=>{calm=!calm;updateTools();say(CONTROLS[calm?'motion-off':'motion-on'])};
reduceMotion.addEventListener?.('change',e=>{calm=e.matches;updateTools()});
function fit(){const v=window.visualViewport;if(v&&v.scale>1.05)return;document.documentElement.style.setProperty('--visible-height',(v?v.height:window.innerHeight)+'px')}
window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});window.addEventListener('pagehide',stopVoice);
