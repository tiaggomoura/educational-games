<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogos Educacionais</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --primary: #7c9cff;
        --primary-dark: #4d6fe6;
        --accent: #ffd86c;
        --accent-soft: #fff1b8;
        --green: #bfe9c9;
        --green-deep: #5ea36f;
        --text: #2d3553;
        --muted: #69759b;
        --shadow: rgba(108, 119, 163, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
        color: var(--text);
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--primary-dark);
      }

      .badge {
        background: var(--accent-soft);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .hero {
        background: linear-gradient(135deg, #ffffff 0%, #edf5ff 100%);
        border-radius: 28px;
        box-shadow: 0 12px 30px var(--shadow);
        padding: 34px 28px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
        color: var(--text);
      }

      .subtitle {
        margin-top: 12px;
        font-size: 1.04rem;
        color: var(--muted);
        max-width: 620px;
      }

      .categories {
        display: grid;
        gap: 20px;
        margin-top: 28px;
      }

      .category {
        border: 1px solid #e4ebff;
        background: var(--panel);
        border-radius: 22px;
        box-shadow: 0 8px 18px rgba(99, 112, 170, 0.07);
        overflow: hidden;
      }

      .category summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 24px;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
        background: linear-gradient(90deg, #edf3ff 0%, #f6faff 100%);
      }

      .category summary::-webkit-details-marker {
        display: none;
      }

      .summary-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 1.8rem;
        background: linear-gradient(135deg, var(--green) 0%, #dff4ff 100%);
      }

      .arrow {
        transition: transform 0.2s ease;
        font-size: 1.5rem;
        color: var(--muted);
      }

      .category[open] .arrow {
        transform: rotate(180deg);
      }

      .content {
        padding: 0 24px 24px;
      }

      .game-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 14px;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(77, 111, 230, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .game-link:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(77, 111, 230, 0.3);
      }

      .game-link span:last-child {
        font-size: 1.2rem;
      }

      .meta {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      @media (max-width: 640px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .hero {
          padding: 24px 18px;
        }

        .category summary {
          padding: 18px 18px;
          font-size: 1.08rem;
        }

        .content {
          padding: 0 18px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <div class="brand">EducaPlay</div>
        <div class="badge">Aprender brincando</div>
      </div>

      <section class="hero">
        <h1>Jogos Educacionais</h1>
        <p class="subtitle">
          Explore atividades divertidas e educativas para estimular o aprendizado com criatividade,
          concentração e muita diversão.
        </p>
      </section>

      <section class="categories" aria-label="Categorias de jogos">
        <details class="category" open>
          <summary>
            <div class="summary-left">
              <div class="icon">🐾</div>
              <span>Animais</span>
            </div>
            <span class="arrow">⌄</span>
          </summary>
          <div class="content">
            <a class="game-link" href="onde-eu-moro.html" aria-label="Acessar Onde eu Moro?">
              <span>🎮</span>
              <span>Onde eu Moro?</span>
            </a>
            <p class="meta">Descubra em qual ambiente cada animal vive: terra, água ou ar.</p>
          </div>
        </details>
      </section>
    </main>
  </body>
</html>
